[package]
name = "stark-prover"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Plonky3 Fibonacci STARK prover, calldata serializer, transcript mirror and test-vector generator for the QuantaStark on-chain verifier"
publish = false

[lib]
name = "stark_prover"
path = "src/lib.rs"

[[bin]]
name = "stark-prover"
path = "src/main.rs"

[dependencies]
# Plonky3, pinned to the exact release candidate the on-chain verifier mirrors (see ../PLONKY3_VERSION).
p3-air = "=0.7.0-rc.1"
p3-challenger = "=0.7.0-rc.1"
p3-commit = "=0.7.0-rc.1"
p3-dft = "=0.7.0-rc.1"
p3-field = "=0.7.0-rc.1"
p3-fri = "=0.7.0-rc.1"
p3-goldilocks = "=0.7.0-rc.1"
p3-keccak = "=0.7.0-rc.1"
p3-matrix = "=0.7.0-rc.1"
p3-merkle-tree = "=0.7.0-rc.1"
p3-symmetric = "=0.7.0-rc.1"
p3-uni-stark = "=0.7.0-rc.1"
p3-util = "=0.7.0-rc.1"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = { version = "0.10", features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Independent keccak for the transcript mirror and the Merkle re-derivation (never routed through p3-keccak).
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[lints.clippy]
all = "warn"
